
name: Compilar Switch Toolbox

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Preparar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Preparar NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restaurar paquetes
        timeout-minutes: 10
        run: nuget restore Toolbox.sln -NonInteractive

      - name: Compilar version Release
        timeout-minutes: 20
        shell: pwsh
        run: |
          msbuild Toolbox.sln /m:1 /nr:false /nologo /p:Configuration=Release '/p:Platform=Any CPU' /verbosity:normal '/flp:logfile=build.log;verbosity=detailed'
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Guardar registro de errores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Registro-Compilacion
          path: build.log
          if-no-files-found: ignore

      - name: Empaquetar Switch Toolbox
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Switch-Toolbox-Release
          path: Toolbox/bin/Release/**
          if-no-files-found: error
